kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Fleet NodePort -> host:8443. Bound on all interfaces so agents on the LAN can enroll.
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "0.0.0.0"
        protocol: TCP

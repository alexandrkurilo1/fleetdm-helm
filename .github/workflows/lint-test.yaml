name: Lint and Test Chart

on:
  pull_request:
    paths: ["charts/**", "ct.yaml", ".github/workflows/lint-test.yaml"]
  push:
    branches: [main]
    paths: ["charts/**", "ct.yaml", ".github/workflows/lint-test.yaml"]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2.7.0

      - name: Lint (also enforces a Chart.yaml version bump on changed charts)
        run: ct lint --config ct.yaml ${{ github.event_name == 'push' && '--all' || '' }}

      - name: Validate rendered manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          helm template fleet charts/fleet | ./kubeconform -strict -summary -kubernetes-version 1.31.0

      - uses: helm/kind-action@v1.12.0
        with:
          node_image: kindest/node:v1.31.4

      - name: Install chart and run helm test
        run: ct install --config ct.yaml ${{ github.event_name == 'push' && '--all' || '' }}

{{- if and .Values.fleet.tls.enabled (not .Values.fleet.tls.existingSecret) }}
{{- $name := include "fleet.tls.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if $existing }}
  {{- /* Keep the certificate stable so already-enrolled agents keep trusting it. */}}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $svc := include "fleet.fullname" . }}
  {{- $dns := concat .Values.fleet.tls.dnsNames (list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svc .Release.Namespace)) }}
  {{- $ca := genCA "fleet-local-ca" (int .Values.fleet.tls.validityDays) }}
  {{- $cert := genSignedCert (first .Values.fleet.tls.dnsNames | default $svc) .Values.fleet.tls.ipAddresses $dns (int .Values.fleet.tls.validityDays) $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}

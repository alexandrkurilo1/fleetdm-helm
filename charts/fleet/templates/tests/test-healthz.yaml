apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fleet.fullname" . }}-test-healthz
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: healthz
      image: curlimages/curl:8.11.1
      # /healthz checks Fleet together with its MySQL and Redis connections.
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - --retry
        - "10"
        - --retry-all-errors
        - --retry-delay
        - "3"
        {{- if .Values.fleet.tls.enabled }}
        - --cacert
        - /tls/ca.crt
        {{- end }}
        - "{{ ternary "https" "http" .Values.fleet.tls.enabled }}://{{ include "fleet.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.fleet.service.port }}/healthz"
      {{- if .Values.fleet.tls.enabled }}
      volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
  volumes:
    - name: tls
      secret:
        secretName: {{ include "fleet.tls.secretName" . }}
        items:
          - key: ca.crt
            path: ca.crt
      {{- end }}

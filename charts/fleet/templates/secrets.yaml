{{- /* Random values are generated once and reused on upgrade via lookup. */}}
{{- $fleetSecret := lookup "v1" "Secret" .Release.Namespace (include "fleet.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet.fullname" . }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $fleetSecret }}
  server-private-key: {{ index $fleetSecret.data "server-private-key" }}
  {{- else }}
  server-private-key: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- if and .Values.mysql.enabled (not .Values.mysql.auth.existingSecret) }}
{{- $mysqlSecret := lookup "v1" "Secret" .Release.Namespace (include "fleet.mysql.fullname" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet.mysql.fullname" . }}
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
data:
  {{- if .Values.mysql.auth.password }}
  mysql-password: {{ .Values.mysql.auth.password | b64enc }}
  {{- else if $mysqlSecret }}
  mysql-password: {{ index $mysqlSecret.data "mysql-password" }}
  {{- else }}
  mysql-password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
  {{- if .Values.mysql.auth.rootPassword }}
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | b64enc }}
  {{- else if $mysqlSecret }}
  mysql-root-password: {{ index $mysqlSecret.data "mysql-root-password" }}
  {{- else }}
  mysql-root-password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
